name: Build Android APK - Final Working Version

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 查找并解压压缩包
        run: |
          echo "=== 查找压缩包文件 ==="
          ls -la *.zip 2>/dev/null || echo "未找到.zip文件"
          
          # 查找ZIP压缩包并解压
          if [ -f "openclaw-android-0.3.0-gradle10-ready.zip" ]; then
            echo "找到: openclaw-android-0.3.0-gradle10-ready.zip"
            unzip -q openclaw-android-0.3.0-gradle10-ready.zip
          elif [ -f "openclaw-android-0.3.0.zip" ]; then
            echo "找到: openclaw-android-0.3.0.zip"
            unzip -q openclaw-android-0.3.0.zip
          else
            echo "错误: 未找到任何ZIP压缩包"
            exit 1
          fi

      - name: 查看解压后的目录结构
        run: |
          echo "=== 当前目录结构 ==="
          ls -la

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 授予 Gradle 执行权限
        run: |
          if [ -f "openclaw-android-0.3.0-gradle10-ready/android/gradlew" ]; then
            chmod +x openclaw-android-0.3.0-gradle10-ready/android/gradlew
          elif [ -f "openclaw-android-0.3.0/android/gradlew" ]; then
            chmod +x openclaw-android-0.3.0/android/gradlew
          elif [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          else
            echo "错误: 未找到gradlew文件"
            exit 1
          fi

      - name: 验证 Java 版本
        run: |
          echo "Java 版本:"
          java -version
          echo ""
          echo "JAVA_HOME: $JAVA_HOME"

      - name: 清理构建
        run: |
          if [ -d "openclaw-android-0.3.0-gradle10-ready/android" ]; then
            cd openclaw-android-0.3.0-gradle10-ready/android
          elif [ -d "openclaw-android-0.3.0/android" ]; then
            cd openclaw-android-0.3.0/android
          elif [ -d "android" ]; then
            cd android
          else
            echo "错误: 未找到android目录"
            exit 1
          fi
          
          echo "=== 当前工作目录 ==="
          pwd
          ./gradlew clean --no-daemon

      - name: 构建 Debug APK
        run: |
          if [ -d "openclaw-android-0.3.0-gradle10-ready/android" ]; then
            cd openclaw-android-0.3.0-gradle10-ready/android
          elif [ -d "openclaw-android-0.3.0/android" ]; then
            cd openclaw-android-0.3.0/android
          elif [ -d "android" ]; then
            cd android
          else
            echo "错误: 未找到android目录"
            exit 1
          fi
          
          echo "=== 开始构建 ==="
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 检查构建产物
        if: always()
        run: |
          echo "=== 检查APK文件 ==="
          if [ -d "openclaw-android-0.3.0-gradle10-ready/android" ]; then
            find openclaw-android-0.3.0-gradle10-ready -name "*.apk" -type f
          elif [ -d "openclaw-android-0.3.0/android" ]; then
            find openclaw-android-0.3.0 -name "*.apk" -type f
          else
            find . -name "*.apk" -type f
          fi

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openclaw-android-debug-apk
          path: |
            openclaw-android-0.3.0-gradle10-ready/android/app/build/outputs/apk/debug/app-debug.apk
            openclaw-android-0.3.0/android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: warn

      - name: 显示构建结果摘要
        if: always()
        run: |
          echo "## 构建结果 📦" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **构建时间**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Java版本**: $(java -version 2>&1 | head -1)" >> $GITHUB_STEP_SUMMARY
          echo "- **Debug APK**: 已上传到 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- **构建状态**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
