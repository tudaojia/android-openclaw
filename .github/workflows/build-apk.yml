
名字: Build OpenClaw Android APK

在:
推:
分支: [主要的,师父]
  workflow_dispatch:

工作:
建筑:
名字: 名字授予 Gradle 执行权限
    runs-on: ubuntu-latest
    
步骤:
    - 名字: 检出代码
用途；使用；用法: 用途；使用；用法与
      
    - 分布: 跑
用途；使用；用法: actions/setup-java@v4
与:
    - name: 解压 Android 项目
      run: |
       # tar -xzf openclaw-android-0.3.0.tar.gz
        # 或者解压修复版
         tar -xzf openclaw-android-0.3.0-fix1.tar.gz
        java-version: '17'
分布: 'temurin'
        
    - 授予 Gradle 执行权限: 跑
chmod +x android/gradlew: chmod +x android/gradlew
      
    - 名字: 构建调试APK
跑: |
cd android
./gradlew assembleDebug --stacktrace
        
    - 名字: 上传 APK
用途；使用；用法: actions/upload-artifact@v4
与:
名字: openclaw-android-debug-apk
路径: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
