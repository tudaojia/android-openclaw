name: Build OpenClaw Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: 授予 Gradle 执行权限
      run: chmod +x openclaw-android-0.3.0/android/gradlew
      
    - name: 构建 Debug APK
      run: |
        cd openclaw-android-0.3.0/android
        ./gradlew assembleDebug --stacktrace
        
    - name: 上传 APK
      uses: actions/upload-artifact@v4
      with:
        name: openclaw-android-debug-apk
        path: openclaw-android-0.3.0/android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
