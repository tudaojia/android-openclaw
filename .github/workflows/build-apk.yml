name: Build OpenClaw Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 解压完整代码
      run: tar -xzf openclaw-android-0.3.0-fixed-complete.tar.gz
      
    - name: 查看解压后的目录结构
      run: |
        echo "=== 当前目录结构 ===" && ls -la
        
    - name: 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: 授予 Gradle 执行权限
      run: |
        chmod +x openclaw-android-0.3.0/android/gradlew
        
    - name: 缓存 Gradle 依赖
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles(' **/*.gradle*', '** /gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: 构建 Debug APK
      run: |
        cd openclaw-android-0.3.0/android
        ./gradlew assembleDebug --stacktrace
        
    - name: 上传 Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: openclaw-android-debug-apk
        path: openclaw-android-0.3.0/android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        
    - name: 显示构建结果摘要
      if: always()
      run: |
        echo "## 构建结果 📦" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Debug APK**: 已上传到 Artifacts" >> $GITHUB_STEP_SUMMARY
