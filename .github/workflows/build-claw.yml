name: Build Claw APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解压项目
        run: |
          if [ -f "claw.zip" ]; then
            echo "✓ 找到 claw.zip"
            unzip -q claw.zip
          else
            echo "✗ 未找到 claw.zip"
            exit 1
          fi

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 授予 Gradle 执行权限
        run: |
          chmod +x claw/android/gradlew

      - name: 构建 Debug APK
        run: |
          cd claw/android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: claw-debug-apk
          path: claw/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
