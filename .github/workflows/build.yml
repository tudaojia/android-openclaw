name: Build Claw APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# 解决 Node.js 20 弃用警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 验证项目结构
        run: |
          echo "当前目录结构:"
          ls -la
          
          echo ""
          echo "Android 目录内容:"
          ls -la android/ 2>/dev/null || echo "android 目录不存在"
          
          # 检查 build.gradle 是否存在
          if [ -f "android/build.gradle" ] || [ -f "android/build.gradle.kts" ]; then
            echo "✓ 找到 Android 项目配置文件"
          else
            echo "✗ 未找到 build.gradle 或 build.gradle.kts"
            find . -name "build.gradle*" 2>/dev/null | head -10
          fi
      
      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
      
      - name: 授予 Gradle 执行权限
        run: |
          chmod +x android/gradlew 2>/dev/null || true
          chmod +x gradlew 2>/dev/null || true
          echo "✓ Gradle 权限已设置"
      
      - name: 构建 Debug APK
        run: |
          cd android
          echo "构建目录: $(pwd)"
          echo "目录内容:"
          ls -la
          
          ./gradlew assembleDebug --stacktrace --no-daemon --info
      
      - name: 查找 APK 文件
        run: |
          echo "查找生成的 APK 文件..."
          find . -name "*.apk" -type f 2>/dev/null
      
      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: claw-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    needs: build
    if: always()
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
      
      - name: 授予 Gradle 执行权限
        run: chmod +x android/gradlew 2>/dev/null || true
      
      - name: 运行 Lint
        run: |
          cd android
          ./gradlew lint || true
      
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: |
            android/app/build/reports/lint-results.*
            **/build/reports/**/*.html
          if-no-files-found: ignore
