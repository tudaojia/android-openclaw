name: Extract and Setup Project

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  extract:
    name: 解压压缩包到主目录
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 查找并解压压缩包
        run: |
          echo "=== 查找压缩包文件 ==="
          ls -la *.tar.gz 2>/dev/null || echo "未找到.tar.gz文件"
          
          # 查找压缩包并解压
          if [ -f "openclaw-android-0.3.0-final-complete.tar.gz" ]; then
            echo "找到: openclaw-android-0.3.0-final-complete.tar.gz"
            tar -xzf openclaw-android-0.3.0-final-complete.tar.gz
            echo "已解压 openclaw-android-0.3.0-final-complete.tar.gz"
          elif [ -f "openclaw-android-0.3.0-fixed-complete.tar.gz" ]; then
            echo "找到: openclaw-android-0.3.0-fixed-complete.tar.gz"
            tar -xzf openclaw-android-0.3.0-fixed-complete.tar.gz
            echo "已解压 openclaw-android-0.3.0-fixed-complete.tar.gz"
          elif [ -f "openclaw-android-0.3.0-complete-with-workflow.tar.gz" ]; then
            echo "找到: openclaw-android-0.3.0-complete-with-workflow.tar.gz"
            tar -xzf openclaw-android-0.3.0-complete-with-workflow.tar.gz
            echo "已解压 openclaw-android-0.3.0-complete-with-workflow.tar.gz"
          else
            echo "错误：未找到任何压缩包文件"
            exit 1
          fi

      - name: 查看解压后的目录结构
        run: |
          echo "=== 当前目录结构 ==="
          ls -la
          
          echo ""
          echo "=== 检查android目录 ==="
          if [ -d "openclaw-android-0.3.0/android" ]; then
            echo "找到: openclaw-android-0.3.0/android"
            echo ""
            echo "android目录内容:"
            ls -la openclaw-android-0.3.0/android
          elif [ -d "android" ]; then
            echo "找到: android"
            echo ""
            echo "android目录内容:"
            ls -la android
          else
            echo "错误：未找到android目录"
            exit 1
          fi

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 授予 Gradle 执行权限
        run: |
          if [ -f "openclaw-android-0.3.0/android/gradlew" ]; then
            chmod +x openclaw-android-0.3.0/android/gradlew
            echo "已授权: openclaw-android-0.3.0/android/gradlew"
          elif [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
            echo "已授权: android/gradlew"
          else
            echo "错误：未找到gradlew文件"
            exit 1
          fi

      - name: 显示 Gradle 版本
        run: |
          if [ -f "openclaw-android-0.3.0/android/gradlew" ]; then
            cd openclaw-android-0.3.0/android
          else
            cd android
          fi
          ./gradlew --version

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 构建 Debug APK
        run: |
          if [ -d "openclaw-android-0.3.0/android" ]; then
            cd openclaw-android-0.3.0/android
          else
            cd android
          fi
          ./gradlew assembleDebug --stacktrace

      - name: 检查构建产物
        if: always()
        run: |
          echo "=== 检查APK文件 ==="
          find . -name "*.apk" -type f || echo "未找到APK文件"

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openclaw-android-debug-apk
          path: |
            openclaw-android-0.3.0/android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: warn

      - name: 显示构建结果摘要
        if: always()
        run: |
          echo "## 构建结果 📦" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **解压状态**: 已解压到主目录" >> $GITHUB_STEP_SUMMARY
          echo "- **构建时间**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Debug APK**: 已上传到 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- **构建状态**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
